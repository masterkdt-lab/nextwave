        <div class="word" id="w0">advisors</div>
        <div class="word" id="w1">partners</div>
        <div class="word" id="w2">mentees</div>
      </div>
    </div>
  </div>
</div>
<script>
(() => {
  const W = 984, H = 744;
  const GAPS = [150, 150, 150];          // identical clear space between visual band edges
  const EDGE = { aquaBot: 528, cyanBot: 584, blueBot: 630 };  // measured visible pixels
  const DWELL = 0.90;
  const scaler = document.getElementById('scaler');
  const stack = document.getElementById('stack');
  const cyan = document.getElementById('ly-cyan'),
        blue = document.getElementById('ly-blue'),
        steel = document.getElementById('ly-steel');
  const words = [document.getElementById('w0'), document.getElementById('w1'), document.getElementById('w2')];
  const smooth = t => t*t*(3-2*t);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function render() {
    const vh = innerHeight;
    const max = document.getElementById('track').offsetHeight - vh;
    let p = reduced ? 3 : Math.min(3, Math.max(0, scrollY / (max * DWELL / 3)));
    const s = stack.offsetWidth / W;
    const g = GAPS.map((G,i) => smooth(Math.min(1, Math.max(0, p - i))) * G * s);
    const t1 = g[0], t2 = g[0]+g[1], t3 = g[0]+g[1]+g[2];
    cyan.style.transform  = `translateY(${t1}px)`;
    blue.style.transform  = `translateY(${t2}px)`;
    steel.style.transform = `translateY(${t3}px)`;
    stack.style.transform = `translateY(${-t3/2}px)`;
    scaler.style.transform = `scale(${Math.min(1, (vh * 0.88) / (H * s + t3))})`;
    // each word at the exact midpoint of its visible gap
    const mids = [
      EDGE.aquaBot*s + g[0]/2,
      EDGE.cyanBot*s + g[0] + g[1]/2,
      EDGE.blueBot*s + g[0] + g[1] + g[2]/2
    ];
    words.forEach((w,i) => {
      w.style.top = mids[i] + 'px';
      const prog = Math.min(1, Math.max(0, p - i));
      w.style.opacity = Math.max(0, (smooth(prog) - .25) / .75);
    });
  }
  addEventListener('scroll', () => requestAnimationFrame(render), {passive:true});
  addEventListener('resize', render);
  render();
})();
</script>
